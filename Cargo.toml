# Meepo — a local-first agent workspace runtime.
[workspace]
resolver = "3"
members = [
    "crates/meepo-core",
    "crates/meepo-runtime",
    "crates/meepo-providers",
    "crates/meepo-tools",
    "crates/meepo-storage",
    "crates/meepo-sandbox",
    "crates/meepo-cli",
    "crates/meepo-headless",
    "crates/meepo-host",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["fan-tastic-z"]
repository = "https://github.com/fan-tastic/meepo"

[workspace.dependencies]
# serde_json is used WITHOUT the `preserve_order` feature on purpose:
# Value::Object then defaults to BTreeMap, so object keys serialize in
# alphabetical order — the stable canonical form this project requires.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "net", "io-util", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
glob = "0.3"
walkdir = "2"
regex = "1"
sha2 = "0.10"

# host daemon (single-owner process protocol spine)
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"

# aimux — Rust alternative to Vercel AI SDK (unified multi-provider interface)
aimux-core = { git = "https://github.com/arcships/aimux.git" }
aimux-providers = { git = "https://github.com/arcships/aimux.git" }
meepo-core = { path = "crates/meepo-core" }
meepo-runtime = { path = "crates/meepo-runtime" }
meepo-providers = { path = "crates/meepo-providers" }
meepo-tools = { path = "crates/meepo-tools" }
meepo-storage = { path = "crates/meepo-storage" }
meepo-sandbox = { path = "crates/meepo-sandbox" }
meepo-headless = { path = "crates/meepo-headless" }
meepo-host = { path = "crates/meepo-host" }

[profile.dev]
debug = "line-tables-only"
